<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل الموسيقى المحلي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --item-bg: #2a2a2a;
            --item-hover: #3a3a3a;
            --primary-color: #1db954;
        }

        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .card { 
            background-color: var(--card-bg); 
            border: 1px solid #333; 
            border-radius: 12px;
            color: #fff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .search-box input {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
        }

        .search-box input:focus {
            background-color: #333;
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(29, 185, 84, 0.25);
        }

        .list-group-item { 
            background-color: var(--item-bg); 
            color: #fff; 
            border: 1px solid #333; 
            margin-bottom: 6px;
            border-radius: 8px !important;
            transition: all 0.2s ease;
        }

        .list-group-item:hover { 
            background-color: var(--item-hover); 
            color: #fff;
        }

        .active-song { 
            background-color: var(--primary-color) !important; 
            color: #fff !important; 
            font-weight: bold;
        }

        .btn-active { 
            background-color: var(--primary-color) !important; 
            color: #fff !important; 
            border-color: var(--primary-color) !important;
        }

        .song-title-display {
            font-size: 1.1rem;
            word-break: break-word;
            margin-bottom: 15px;
        }

        /* تحسينات الشاشات الصغيرة (الموبايل) */
        @media (max-width: 576px) {
            body {
                padding: 10px;
            }

            h2 {
                font-size: 1.4rem;
            }

            .search-form {
                flex-direction: column;
                gap: 10px;
            }

            .search-form input, .search-form button {
                width: 100% !important;
            }

            .loop-controls {
                flex-direction: column;
                width: 100%;
            }

            .loop-controls button {
                width: 100%;
                margin-bottom: 5px;
            }

            .song-item {
                font-size: 0.9rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h2 class="text-center my-3">🎵 مشغل الموسيقى المحلي</h2>

        <!-- نموذج البحث المتجيب -->
        <form method="GET" class="search-form d-flex mb-4 search-box">
            <input type="text" name="q" class="form-control me-sm-2 mb-2 mb-sm-0" placeholder="ابحث عن اسم الأغنية..." required>
            <button type="submit" class="btn btn-success px-4">تحميل وتشغيل</button>
        </form>

        <!-- مشغل الصوت والتحكم -->
        <div class="card p-3 p-sm-4 mb-4 text-center">
            <div id="songTitle" class="song-title-display text-success">
                {% if current_song %} {{ current_song.title }} {% else %} اختر أغنية لبدء التشغيل {% endif %}
            </div>
            
            <audio id="audioPlayer" controls class="w-100 my-2" autoplay>
                {% if current_song and current_song.audio_file %}
                    <source src="{{ current_song.audio_file.url }}" type="audio/mpeg">
                {% endif %}
            </audio>

            <!-- أزرار التكرار المتجاوبة -->
            <div class="d-flex justify-content-center gap-2 mt-3 loop-controls">
                <button id="singleLoopBtn" onclick="toggleSingleLoop()" class="btn btn-outline-light btn-sm p-2">
                    🔂 تكرار الأغنية: <span id="singleLoopStatus">إيقاف</span>
                </button>
                <button id="playlistLoopBtn" onclick="togglePlaylistLoop()" class="btn btn-outline-light btn-sm p-2">
                    🔁 تكرار القائمة: <span id="playlistLoopStatus">إيقاف</span>
                </button>
            </div>
        </div>

        <!-- قائمة التشغيل -->
        <h4 class="mb-3">📚 المكتبة المحفوظة</h4>
        <div class="list-group" id="playlist">
            {% for song in songs %}
                {% if song.audio_file %}
                <button onclick="playSong('{{ song.audio_file.url }}', '{{ song.title|escapejs }}', this)" 
                        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center song-item">
                    <span class="text-truncate me-2">{{ song.title }}</span>
                    <span class="badge bg-secondary rounded-pill">MP3</span>
                </button>
                {% endif %}
            {% empty %}
                <div class="text-center text-muted py-4">لا توجد أغاني محفوظة بعد. ابحث عن أغنية لتحميلها.</div>
            {% endfor %}
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        let isSingleLoop = false;
        let isPlaylistLoop = false;
        let currentSongIndex = -1;

        function playSong(url, title, element) {
            audioPlayer.src = url;
            document.getElementById('songTitle').innerText = title;
            audioPlayer.play();

            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active-song'));
            if(element) element.classList.add('active-song');
            
            const items = Array.from(document.querySelectorAll('.song-item'));
            currentSongIndex = items.indexOf(element);
        }

        function toggleSingleLoop() {
            isSingleLoop = !isSingleLoop;
            audioPlayer.loop = isSingleLoop;
            
            const btn = document.getElementById('singleLoopBtn');
            const status = document.getElementById('singleLoopStatus');
            
            if (isSingleLoop) {
                status.innerText = "تفعيل";
                btn.classList.add('btn-active');
            } else {
                status.innerText = "إيقاف";
                btn.classList.remove('btn-active');
            }
        }

        function togglePlaylistLoop() {
            isPlaylistLoop = !isPlaylistLoop;
            const btn = document.getElementById('playlistLoopBtn');
            const status = document.getElementById('playlistLoopStatus');
            
            if (isPlaylistLoop) {
                status.innerText = "تفعيل";
                btn.classList.add('btn-active');
            } else {
                status.innerText = "إيقاف";
                btn.classList.remove('btn-active');
            }
        }

        audioPlayer.onended = function() {
            if (isSingleLoop) return;

            const items = document.querySelectorAll('.song-item');
            if (items.length === 0) return;

            let nextIndex = currentSongIndex + 1;

            if (nextIndex < items.length) {
                items[nextIndex].click();
            } else if (isPlaylistLoop) {
                items[0].click();
            }
        };
    </script>
</body>
</html>
